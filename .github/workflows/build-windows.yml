name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read app version
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          "APP_VERSION=$v" >> $env:GITHUB_ENV
          Write-Host "Version $v"

      - name: Generate platform folders
        run: flutter create --platforms=windows,android --org com.rady --project-name unit_converter .

      - name: Brand the Windows app (name, window, icon)
        shell: pwsh
        run: |
          Remove-Item test/widget_test.dart -ErrorAction SilentlyContinue

          $f = 'windows/runner/main.cpp'
          (Get-Content $f -Raw) `
            -replace 'L"unit_converter"', 'L"Unit Converter"' `
            -replace 'Size size\(\d+, \d+\)', 'Size size(1100, 720)' | Set-Content $f

          $f = 'windows/CMakeLists.txt'
          (Get-Content $f -Raw) -replace 'set\(BINARY_NAME "unit_converter"\)', 'set(BINARY_NAME "UnitConverter")' | Set-Content $f

          $f = 'windows/runner/Runner.rc'
          (Get-Content $f -Raw) `
            -replace '"FileDescription", "unit_converter"', '"FileDescription", "Unit Converter"' `
            -replace '"ProductName", "unit_converter"', '"ProductName", "Unit Converter"' `
            -replace '"InternalName", "unit_converter"', '"InternalName", "UnitConverter"' `
            -replace '"OriginalFilename", "unit_converter.exe"', '"OriginalFilename", "UnitConverter.exe"' `
            -replace 'com\.rady', 'Rady Radwan' | Set-Content $f

          # window_manager shows the window itself once it has the saved size
          $f = 'windows/runner/flutter_window.cpp'
          (Get-Content $f -Raw) -replace 'this->Show\(\);', '' | Set-Content $f
          Select-String -Path $f -Pattern 'SetNextFrameCallback' -Context 0,2

          Copy-Item assets/icon/app_icon.ico windows/runner/resources/app_icon.ico -Force
          Select-String -Path windows/runner/main.cpp -Pattern 'window.Create|Size size'
          Select-String -Path windows/CMakeLists.txt -Pattern 'BINARY_NAME "'

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Bundle Visual C++ runtime and make portable zip
        shell: pwsh
        run: |
          $out = 'build/windows/x64/runner/Release'
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR/System32/$dll" $out -Force
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$out/*" -DestinationPath "dist/UnitConverter-Portable-$env:APP_VERSION.zip" -Force
          Get-ChildItem $out

      - name: Build installer (.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" installer\UnitConverter.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - name: Smoke test (launch the app, type in both boxes, take screenshots)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public struct RECT { public int Left, Top, Right, Bottom; }
          public struct POINT { public int X, Y; }
          public static class W {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint x, uint y, uint d, int e);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool MoveWindow(IntPtr h, int x, int y, int w, int ht, bool r);
            [DllImport("user32.dll")] public static extern bool GetClientRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool ClientToScreen(IntPtr h, ref POINT p);
          }
          "@

          $p = Start-Process build/windows/x64/runner/Release/UnitConverter.exe -PassThru
          Start-Sleep 14
          if ($p.HasExited) { Write-Error "App exited early (code $($p.ExitCode))"; exit 1 }
          $p.Refresh()
          $h = $p.MainWindowHandle
          Write-Host "Window title: '$($p.MainWindowTitle)'  handle: $h"
          if ($h -eq [IntPtr]::Zero) { Write-Error "Window never became visible"; exit 1 }
          [W]::MoveWindow($h, 0, 0, 1024, 728, $true) | Out-Null
          [W]::SetForegroundWindow($h) | Out-Null
          Start-Sleep 3

          $rc = New-Object RECT; [W]::GetClientRect($h, [ref]$rc) | Out-Null
          $pt = New-Object POINT; [W]::ClientToScreen($h, [ref]$pt) | Out-Null
          $cw = $rc.Right - $rc.Left
          $scale = [Math]::Min([Math]::Max($cw / 1150.0, 0.6), 2.2)
          Write-Host "Client width $cw, scale $scale, origin $($pt.X),$($pt.Y)"

          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("dist/$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          # Click at a point given in the app's own (unscaled) layout units
          function Click($lx, $ly) {
            $x = [int]($pt.X + $lx * $scale); $y = [int]($pt.Y + $ly * $scale)
            [W]::SetCursorPos($x, $y); Start-Sleep -Milliseconds 250
            [W]::mouse_event(2, 0, 0, 0, 0); [W]::mouse_event(4, 0, 0, 0, 0)
            Start-Sleep -Milliseconds 700
          }
          function TypeText($text) {
            [System.Windows.Forms.SendKeys]::SendWait('{END}')
            [System.Windows.Forms.SendKeys]::SendWait('{BACKSPACE 30}')
            [System.Windows.Forms.SendKeys]::SendWait($text)
            Start-Sleep 2
          }

          Shot 'screenshot-1-start'
          # Type in the TO box: 100 ft -> From shows meters
          Click 700 198; TypeText '100'
          Shot 'screenshot-2-type-in-to-box'
          # 0.36 m -> Feet-inches
          Click 150 198; TypeText '0.36'
          Click 800 266; Start-Sleep 1
          Shot 'screenshot-3a-unit-menu'
          Click 800 314; Start-Sleep 2
          Shot 'screenshot-3-feet-inches'
          # Temperature tab, type 212 in the TO box
          Click 460 80; Start-Sleep 2
          Click 700 198; TypeText '212'
          Shot 'screenshot-4-temperature'
          # Settings window
          Click 1118 28; Start-Sleep 2
          Shot 'screenshot-5-settings'
          # Smaller window -> everything scales down
          [System.Windows.Forms.SendKeys]::SendWait('{ESC}'); Start-Sleep 1
          [W]::MoveWindow($h, 0, 0, 760, 560, $true) | Out-Null
          Start-Sleep 2
          Shot 'screenshot-6-small-window'
          if ($p.HasExited) { Write-Error "App crashed during the test"; exit 1 }
          Stop-Process -Id $p.Id -Force

      - name: Save build to the 'builds' branch
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $tmp = Join-Path $env:RUNNER_TEMP 'builds'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Copy-Item dist/* $tmp
          Set-Location $tmp
          git init -b builds
          git add .
          git commit -m "Build $env:APP_VERSION from $env:GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds

      - uses: actions/upload-artifact@v4
        with:
          name: UnitConverter-Windows-${{ env.APP_VERSION }}
          path: dist/*

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Unit Converter v${{ env.APP_VERSION }}
          make_latest: true
          overwrite_files: true
          files: |
            dist/UnitConverter-Setup-*.exe
            dist/UnitConverter-Portable-*.zip
          body: |
            **Install:** download `UnitConverter-Setup-${{ env.APP_VERSION }}.exe` and run it (no admin rights needed).
            **Portable:** or unzip `UnitConverter-Portable-${{ env.APP_VERSION }}.zip` anywhere and run `UnitConverter.exe`.
