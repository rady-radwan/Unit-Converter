name: unit_converter
description: "Unit Converter — SI and Imperial unit conversions with formulas."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  window_manager: ">=0.4.3 <0.6.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_700Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto_400Regular.ttf
        - asset: assets/fonts/Roboto_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto_700Bold.ttf
          weight: 700
    - family: Open Sans
      fonts:
        - asset: assets/fonts/OpenSans_400Regular.ttf
        - asset: assets/fonts/OpenSans_500Medium.ttf
          weight: 500
        - asset: assets/fonts/OpenSans_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans_700Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat_400Regular.ttf
        - asset: assets/fonts/Montserrat_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat_700Bold.ttf
          weight: 700
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato_400Regular.ttf
        - asset: assets/fonts/Lato_700Bold.ttf
          weight: 700
    - family: Work Sans
      fonts:
        - asset: assets/fonts/WorkSans_400Regular.ttf
        - asset: assets/fonts/WorkSans_500Medium.ttf
          weight: 500
        - asset: assets/fonts/WorkSans_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/WorkSans_700Bold.ttf
          weight: 700
    - family: Josefin Sans
      fonts:
        - asset: assets/fonts/JosefinSans_400Regular.ttf
        - asset: assets/fonts/JosefinSans_500Medium.ttf
          weight: 500
        - asset: assets/fonts/JosefinSans_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JosefinSans_700Bold.ttf
          weight: 700
